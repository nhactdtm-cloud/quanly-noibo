<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <title>G_199K Premium System</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="js/user/user.css">
    <link rel="stylesheet" href="js/thuchi/thuchi.css">
    <link rel="stylesheet" href="js/g199k/g199k.css">
    <link rel="stylesheet" href="js/notification/notification.css">
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="lg-sc">
        <div class="lg-bx">
            <h2>G_199K / CORE</h2>
            <div class="login-sub">Hệ thống quản lý nội bộ</div>
            <div class="gr"><label>Tài khoản</label><input type="text" id="un" value="admin"></div>
            <div class="gr"><label>Mật khẩu</label><input type="password" id="pw" placeholder="••••••"></div>
            <button class="btn-sm" id="btn-login-submit">ĐĂNG NHẬP</button>
        </div>
    </div>

    <!-- KHÔNG GIAN ỨNG DỤNG CHÍNH -->
    <div id="ap" class="app-ct">
        <div class="sb">
            <div class="logo">G_199K / CORE</div>
            <div class="menu">
                <button class="m-btn" id="btn-g">📁 G_199K</button>
                <button class="m-btn active" id="btn-t">🪙 THU CHI</button>
            </div>
            <!-- THÊM NÚT NÀY VÀO DƯỚI CÙNG KHỐI SIDEBAR -->
            <button class="m-btn logout-btn" id="btn-logout" style="margin-top: auto; color: var(--d); font-weight: 700;">🚪 ĐĂNG XUẤT</button>
        </div>
        <div class="main">
            <!-- Giữ nguyên toàn bộ nội dung phía sau ... -->

            <div class="usr-bar" id="usr-disp">👤 Tài khoản: -</div>
            
            <!-- TRANG THU CHI CHUẨN CẤU TRÚC 2 CỘT -->
            <div id="p-t" class="page active">
                <h2>Tạo Giao Dịch Mới</h2>
                <div class="thuchi-workspace">
                    
                    <!-- CỘT TRÁI (FORM NHẬP LIỆU) -->
                    <div class="card">
                        <div class="seg">
                            <button class="seg-btn active thu" id="s-thu">THU TIỀN</button>
                            <button class="seg-btn" id="s-chi">CHI TIỀN</button>
                        </div>
                        <div class="gr"><label>ID Lệnh</label><input type="text" id="id" readonly></div>
                        <div class="gr"><label>Khách Hàng</label><input type="text" id="kh" placeholder="G2603020"></div>
                        <div class="gr"><label>Ghi Chú</label><input type="text" id="gc" placeholder="Nhập nội dung..."></div>
                        <div class="gr"><label>Loại Giao Dịch</label><select id="lgd"></select></div>
                        <div class="gr"><label>Số Tiền (VND)</label><input type="number" inputmode="numeric" id="st" placeholder="0"></div>
                        <div class="gr">
                            <label style="opacity: 0; visibility: hidden;">&nbsp;</label>
                            <button class="btn-sm" id="btn-add-data">NHẬP DỮ LIỆU</button>
                        </div>
                    </div>

                    <!-- CỘT PHẢI (BỌC CHUNG 2 KHỐI TRÊN - DƯỚI) -->
                    <div class="thuchi-workspace-right">
                        
                        <!-- KHỐI HOẠT ĐỘNG (HÀNG TRÊN) -->
                        <div class="stat-sidebar">
                            <div class="stat-box-title">📊 HOẠT ĐỘNG HÔM NAY</div>
                            <div class="stat-card">
                                <span class="stat-label">Tổng hóa đơn đã duyệt</span>
                                <span class="stat-val" id="stat-total-orders">0</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Doanh thu trong ngày</span>
                                <span class="stat-val thu" id="stat-total-revenue">0đ</span>
                            </div>
                            <div class="stat-card">
                                <span class="stat-label">Tổng chi phí phát sinh</span>
                                <span class="stat-val chi" id="stat-total-expense">0đ</span>
                            </div>
                        </div>

                        <!-- KHỐI ĐỐI SOÁT (HÀNG DƯỚI) -->
                        <div class="quick-history">
                            <div class="stat-box-title">⚡ ĐỐI SOÁT VỪA NHẬP</div>
                            <div id="mini-rows">
                                <!-- JS tự động chèn lịch sử mini vào đây -->
                            </div>
                            <div class="helper-text">Mẹo PC: Nhấn Tab để chuyển ô nhập nhanh.</div>
                        </div>

                    </div>
                </div>
            </div>

            <!-- TRANG G_199K (NHẬT KÝ TỔNG) -->
            <div id="p-g" class="page">
                <h2>Nhật Ký Hệ Thống</h2>
                <div class="list" id="l-r">
                    <!-- JS tự động chèn nhật ký tổng vào đây -->
                </div>
            </div>
        </div>
    </div>

    <script src="js/notification/notification.js"></script>
    <script src="js/user/user.js"></script>
    <script src="js/thuchi/thuchi.js"></script>
    <script src="js/g199k/g199k.js"></script>
    <script src="js/ap.js"></script>
</body>
</html>
